name: Build Smillet-Next APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip if uploaded as archive
        run: |
          for z in Smillet-Next_v3.2.zip Smillet-Next*.zip smillet_next*.zip; do
            if [ -f "$z" ]; then
              echo "Found $z, extracting..."
              unzip -o -q "$z"
              break
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build Debug & Release APKs
        run: gradle :app:assembleDebug :app:assembleRelease -x lint --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Smillet-Next-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Smillet-Next-release-apk
          path: app/build/outputs/apk/release/*.apk
