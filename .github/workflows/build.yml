name: Build smillet-next APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Unpack smillet_next_v3.0.zip
        run: |
          if [ -f "smillet_next_v3.0.zip" ]; then
            unzip -o "smillet_next_v3.0.zip"
          else
            unzip -o "$(ls -t *.zip | head -n 1)"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build Debug & Release APKs
        run: |
          gradle :app:assembleDebug :app:assembleRelease -x lint

      - name: Sign Release APK for direct install
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)
          if [ -n "$UNSIGNED_APK" ]; then
            keytool -genkey -v -keystore release.keystore -alias smillet -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=SMillet, OU=Dev, O=OpenSource, L=Beijing, S=Beijing, C=CN"
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            "$BUILD_TOOLS_DIR/apksigner" sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out app/build/outputs/apk/release/smillet-next-release-signed.apk "$UNSIGNED_APK"
          fi

      - name: Upload Compiled APKs
        uses: actions/upload-artifact@v4
        with:
          name: smillet-next-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*-signed.apk
