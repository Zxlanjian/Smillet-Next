name: Build SMillet-Miuix APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Unpack ZIP & Apply Theme/Getter Fix
        run: |
          if [ -f "SMillet_Miuix_v2.2_Fixed.zip" ]; then
            unzip -o "SMillet_Miuix_v2.2_Fixed.zip"
          elif [ -f "SMillet_Miuix_v2.1_Fixed.zip" ]; then
            unzip -o "SMillet_Miuix_v2.1_Fixed.zip"
          else
            unzip -o "$(ls -t *.zip | head -n 1)"
          fi

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SMillet" parent="@android:style/Theme.DeviceDefault.DayNight">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
              </style>
          </resources>
          EOF

          sed -i 's/@android:style\/Theme.DeviceDefault.DayNight.NoActionBar/@style\/Theme.SMillet/g' app/src/main/AndroidManifest.xml
          sed -i 's/var systemContext: Context? = null/private var cachedSystemContext: Context? = null/g' app/src/main/java/com/sidesand/millet/hook/system/SystemServerHook.kt
          sed -i 's/systemContext = ctx/cachedSystemContext = ctx/g' app/src/main/java/com/sidesand/millet/hook/system/SystemServerHook.kt
          sed -i 's/systemContext?.let/cachedSystemContext?.let/g' app/src/main/java/com/sidesand/millet/hook/system/SystemServerHook.kt
          sed -i 's/systemContext = it/cachedSystemContext = it/g' app/src/main/java/com/sidesand/millet/hook/system/SystemServerHook.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build Debug & Release APKs
        run: |
          gradle :app:assembleDebug :app:assembleRelease -x lint

      - name: Sign Release APK for direct install
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)
          if [ -n "$UNSIGNED_APK" ]; then
            keytool -genkey -v -keystore release.keystore -alias smillet -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=SMillet, OU=Dev, O=OpenSource, L=Beijing, S=Beijing, C=CN"
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            "$BUILD_TOOLS_DIR/apksigner" sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out app/build/outputs/apk/release/SMillet-Miuix-release-signed.apk "$UNSIGNED_APK"
          fi

      - name: Upload Compiled APKs
        uses: actions/upload-artifact@v4
        with:
          name: SMillet-Miuix-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*-signed.apk
